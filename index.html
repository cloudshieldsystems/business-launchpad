<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#4f46e5" />
<title>Business Launchpad</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  :root {
    --brand: #4f46e5;
    --brand-dark: #4338ca;
    --brand-light: #eef2ff;
    --green: #059669;
    --green-light: #ecfdf5;
    --amber: #b45309;
    --amber-light: #fffbeb;
    --ink: #1e293b;
    --ink-soft: #64748b;
    --line: #e2e8f0;
    --bg: #f8fafc;
    --card: #ffffff;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    min-height: 100vh;
  }
  #root { max-width: 520px; margin: 0 auto; padding: 0 16px 48px; }

  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 2px 14px;
  }
  .logo {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, #6366f1, #4338ca);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px; flex-shrink: 0;
  }
  .brandname { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
  .brandtag { font-size: 12px; color: var(--ink-soft); margin-top: -2px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 20px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    margin-bottom: 16px;
  }

  h1 { font-size: 26px; letter-spacing: -0.03em; line-height: 1.2; margin-bottom: 10px; }
  h2 { font-size: 20px; letter-spacing: -0.02em; line-height: 1.25; margin-bottom: 8px; }
  p.sub { color: var(--ink-soft); font-size: 15px; }

  .btn {
    display: block; width: 100%;
    padding: 15px 18px;
    border-radius: 12px;
    border: none;
    font-size: 16px; font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: background 0.15s, transform 0.05s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.985); }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-dark); }
  .btn-primary:disabled { background: #c7d2fe; cursor: not-allowed; }
  .btn-secondary {
    background: #fff; color: var(--ink);
    border: 1.5px solid var(--line);
  }
  .btn-secondary:hover { border-color: #cbd5e1; background: #f8fafc; }
  .btn-green { background: var(--green); color: #fff; }
  .btn-green:hover { background: #047857; }
  .btn-green:disabled { background: #a7f3d0; cursor: not-allowed; }
  .btn + .btn { margin-top: 10px; }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-row .btn { flex: 1 1 0; margin-top: 0; padding-left: 10px; padding-right: 10px; }

  label.field-label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .field-help { font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
  textarea, select {
    width: 100%;
    padding: 13px 14px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-size: 16px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
    outline: none;
  }
  textarea:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12); }
  textarea { resize: vertical; min-height: 88px; max-height: 260px; overflow-y: auto; }
  input[type="text"], input[type="date"] {
    width: 100%;
    padding: 13px 14px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-size: 16px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
    outline: none;
  }
  input[type="text"]:focus, input[type="date"]:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12); }
  input[type="date"] { -webkit-appearance: none; appearance: none; min-height: 50px; }
  .field { margin-bottom: 20px; }
  .soon-note { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }

  .choice {
    display: block; width: 100%;
    text-align: left;
    padding: 14px 16px;
    margin-bottom: 10px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: #fff;
    font-size: 15px; font-weight: 500;
    font-family: inherit;
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .choice:hover { border-color: #cbd5e1; }
  .choice.selected {
    border-color: var(--brand);
    background: var(--brand-light);
    box-shadow: 0 0 0 1px var(--brand);
  }

  .progress-wrap { padding: 4px 2px 16px; }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 13px; font-weight: 600; color: var(--ink-soft);
    margin-bottom: 7px;
  }
  .progress-track {
    height: 8px; border-radius: 99px; background: #e2e8f0; overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, #6366f1, #4f46e5);
    transition: width 0.4s ease;
  }

  .step-eyebrow {
    display: inline-block;
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--brand);
    background: var(--brand-light);
    padding: 4px 10px; border-radius: 99px;
    margin-bottom: 12px;
  }
  .meta-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 4px; }
  .meta-chip {
    flex: 1 1 130px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .meta-chip .k { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  .meta-chip .v { font-size: 14px; font-weight: 600; margin-top: 2px; }

  .warning {
    background: var(--amber-light);
    border: 1px solid #fde68a;
    color: var(--amber);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    margin-top: 14px;
  }
  .tips { margin-top: 14px; }
  .tips li, .doc-check li {
    font-size: 14px; color: var(--ink-soft);
    margin: 6px 0 6px 0; list-style: none;
    padding-left: 22px; position: relative;
  }
  .tips li::before { content: "💡"; position: absolute; left: 0; font-size: 12px; top: 2px; }
  .doc-check { margin-top: 12px; }
  .doc-check li::before { content: "📄"; position: absolute; left: 0; font-size: 12px; top: 2px; }
  .doc-check-title, .tips-title { font-size: 13px; font-weight: 700; margin-top: 14px; }

  .step-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .navlink {
    background: none; border: none; font-family: inherit;
    color: var(--ink-soft); font-size: 14px; font-weight: 600;
    cursor: pointer; padding: 8px 6px;
  }
  .navlink:disabled { opacity: 0.35; cursor: default; }
  .navlink.fwd { color: var(--brand); }

  .done-banner {
    display: flex; align-items: center; gap: 8px;
    background: var(--green-light); color: var(--green);
    border: 1px solid #a7f3d0;
    border-radius: 12px; padding: 10px 14px;
    font-weight: 600; font-size: 14px; margin-bottom: 14px;
  }

  .reco-type {
    font-size: 24px; font-weight: 800; letter-spacing: -0.02em;
    color: var(--brand); margin: 4px 0 10px;
  }
  .reco-note {
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px;
    font-size: 13.5px; color: var(--ink-soft); margin-top: 14px;
  }

  .summary-list { margin: 14px 0; }
  .summary-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
    font-size: 14.5px;
  }
  .summary-item:last-child { border-bottom: none; }
  .summary-item .check { color: var(--green); font-weight: 700; flex-shrink: 0; }
  .summary-item .cost { margin-left: auto; color: var(--ink-soft); font-weight: 600; white-space: nowrap; font-size: 13.5px; }

  .total-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 14px 16px; border-radius: 12px;
    background: var(--brand-light); border: 1px solid #c7d2fe;
    font-weight: 700; margin-top: 6px;
  }
  .total-row .amt { font-size: 22px; color: var(--brand); }
  .total-foot { font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; }

  .next-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .next-item:last-child { border-bottom: none; }
  .next-item .ico {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    background: var(--brand-light); display: flex; align-items: center; justify-content: center;
    font-size: 17px;
  }
  .next-item .t { font-weight: 600; font-size: 14.5px; }
  .next-item .d { font-size: 13px; color: var(--ink-soft); }

  .quiz-dots { display: flex; gap: 6px; margin-bottom: 16px; }
  .quiz-dots span { width: 8px; height: 8px; border-radius: 99px; background: var(--line); transition: background 0.2s; }
  .quiz-dots span.on { background: var(--brand); }

  .idea-banner {
    font-size: 13px; color: var(--ink-soft);
    background: #fff; border: 1px dashed var(--line);
    border-radius: 12px; padding: 10px 14px; margin-bottom: 14px;
  }
  .idea-banner b { color: var(--ink); }

  .record-list { margin-top: 10px; }
  .record-row {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
    font-size: 14.5px;
  }
  .record-row:last-child { border-bottom: none; }
  .record-row .k { color: var(--ink-soft); flex-shrink: 0; }
  .record-row .v { font-weight: 600; text-align: right; word-break: break-word; }

  .due-box {
    background: var(--brand-light); border: 1px solid #c7d2fe;
    border-radius: 12px; padding: 14px 16px; margin: 12px 0 14px;
  }
  .due-box .k { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--brand); }
  .due-box .v { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 2px 0; }
  .due-box .d { font-size: 13px; color: var(--ink-soft); }

  .hero-badges { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 20px; }
  .hero-badge {
    font-size: 12.5px; font-weight: 600; color: var(--ink-soft);
    background: #fff; border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 99px;
  }
  .footer-note { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 20px; padding: 0 10px; }
  /* ---- Formation record PDF (print sheet) ---- */
  .print-sheet { display: none; }
  @media print {
    @page { size: letter; margin: 14mm 16mm; }
    html, body { background: #fff !important; }
    #root { max-width: none; padding: 0; }
    .no-print { display: none !important; }
    .print-sheet { display: block; color: #111; font-size: 12px; line-height: 1.45; }
    .ps-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #111; padding-bottom: 8px; margin-bottom: 14px; }
    .ps-brand { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #555; }
    .ps-title { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; }
    .ps-meta { font-size: 11px; color: #555; text-align: right; }
    .ps-name { font-size: 20px; font-weight: 800; margin: 0 0 4px; }
    .ps-sub { color: #444; margin-bottom: 12px; }
    .ps-section { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #555; margin: 14px 0 4px; }
    .ps-grid { width: 100%; border-collapse: collapse; }
    .ps-grid td { padding: 5px 0; border-bottom: 1px solid #ddd; vertical-align: top; }
    .ps-grid td.k { width: 38%; color: #555; }
    .ps-grid td.v { font-weight: 600; }
    .ps-grid td.c { text-align: right; white-space: nowrap; }
    .ps-total td { border-top: 2px solid #111; border-bottom: none; font-weight: 700; padding-top: 7px; }
    .ps-callout { border: 1px solid #bbb; border-radius: 8px; padding: 10px 12px; margin-top: 8px; background: #f7f7f7; }
    .ps-foot { margin-top: 18px; padding-top: 8px; border-top: 1px solid #ddd; font-size: 10.5px; color: #666; }
    .ps-foot p { margin: 2px 0; }
  }

  .reset-link { background: none; border: none; font-family: inherit; color: #94a3b8; font-size: 12px; text-decoration: underline; cursor: pointer; margin-top: 14px; display: block; margin-left: auto; margin-right: auto; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

/* ---------------- Data ---------------- */

// Typical annual price of a Virginia registered agent service. Single source of truth:
// referenced by the Step 2 tip, the capture option, the summary, and the print sheet.
const AGENT_SERVICE_COST = 125;

const QUIZ = [
  {
    id: 'investors',
    question: 'Do you plan to raise money from investors, like venture capital?',
    help: 'Investors give you money now in exchange for owning a piece of your company.',
    options: [
      { value: 'yes', label: 'Yes, I want to raise investor money' },
      { value: 'no', label: 'No, I’ll fund it myself (or with loans)' },
      { value: 'unsure', label: 'Not sure yet' },
    ],
  },
  {
    id: 'profit',
    question: 'How much profit do you expect each year, once things are going?',
    help: 'Profit is the money left over after you pay all your costs.',
    options: [
      { value: 'low', label: 'Under $60,000 a year' },
      { value: 'high', label: 'More than $60,000 a year' },
      { value: 'unsure', label: 'No idea yet — too early to tell' },
    ],
  },
  {
    id: 'simplicity',
    question: 'How much paperwork are you okay with?',
    help: 'Some business types need yearly meetings, extra tax forms, and more record-keeping.',
    options: [
      { value: 'minimal', label: 'As little as possible, please' },
      { value: 'fine', label: 'I don’t mind extra paperwork if it saves money' },
    ],
  },
];

function recommendEntity(a) {
  if (a.investors === 'yes') {
    return {
      type: 'C-Corporation',
      why: 'You want to raise money from investors. Investors almost always ask for a C-corp, because it lets them own shares of your company. It has the most paperwork, but it’s the standard choice for startups that want outside funding.',
      note: 'Heads up: most startups that raise money form in Delaware first, then register in Virginia too. Talk to a startup lawyer before you file.',
    };
  }
  if (a.profit === 'high' && a.simplicity === 'fine') {
    return {
      type: 'LLC with S-Corp election',
      why: 'You expect solid profit and don’t mind some extra paperwork. An LLC keeps setup simple. Then, once profit passes about $60,000 a year, asking the IRS to tax it like an S-corp can lower your self-employment taxes. You start with the LLC now and add the S-corp part later.',
      note: 'The S-corp election is a free IRS form (Form 2553). An accountant can tell you exactly when it starts saving you money.',
    };
  }
  return {
    type: 'LLC (Limited Liability Company)',
    why: 'An LLC is the simplest way to protect your personal stuff — like your house and savings — if the business is ever sued or owes money. Setup is easy, Virginia charges just one $100 fee, and taxes stay simple: profit goes right on your personal tax return.',
    note: 'This is the most common choice for new small businesses in Virginia. You can always switch to a corporation later if things take off.',
  };
}

function displayName(record, idea) {
  const n = (record.businessName || '').trim();
  if (n) return n;
  const i = (idea || '').trim();
  if (!i) return '';
  // fall back to a short slice so a long description never masquerades as a name
  return i.length > 60 ? i.slice(0, 57).trimEnd() + '…' : i;
}

/* ---------------- Annual registration fee ---------------- */

// Virginia: the annual registration fee is due every year by the last day of the
// month the business was formed, starting the year after formation.
function parseISODate(str) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || '');
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  if (mo < 1 || mo > 12 || d < 1 || d > lastDayOfMonth(y, mo)) return null;
  return { y, m: mo, d };
}
function lastDayOfMonth(y, m) { return new Date(y, m, 0).getDate(); }
function nextAnnualDue(articlesDate, today = new Date()) {
  const p = parseISODate(articlesDate);
  if (!p) return null;
  const t = { y: today.getFullYear(), m: today.getMonth() + 1, d: today.getDate() };
  let y = p.y + 1;
  // roll forward past any due dates that have already gone by
  while (y < t.y || (y === t.y && (p.m < t.m || (p.m === t.m && lastDayOfMonth(y, p.m) < t.d)))) y++;
  return { y, m: p.m, d: lastDayOfMonth(y, p.m) };
}
function fmtDate(dt) {
  return new Date(dt.y, dt.m - 1, dt.d).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}
function pad2(n) { return String(n).padStart(2, '0'); }
function ymd(dt) { return `${dt.y}${pad2(dt.m)}${pad2(dt.d)}`; }
function addDays(dt, n) {
  const x = new Date(dt.y, dt.m - 1, dt.d + n);
  return { y: x.getFullYear(), m: x.getMonth() + 1, d: x.getDate() };
}
function annualFee(reco) {
  return reco.type.startsWith('C-Corp')
    ? { amount: 'from $100', label: 'annual report + registration fee' }
    : { amount: '$50', label: 'annual registration fee' };
}
function calendarLinks(due, name, fee) {
  const who = name || 'My business';
  const title = `${who}: Virginia ${fee.label} due (${fee.amount})`;
  const details = `Pay online at https://cis.scc.virginia.gov before the end of the month. A $25 late penalty applies after the due date, and the state can cancel your business if it stays unpaid.`;
  const start = ymd(due), end = ymd(addDays(due, 1));
  const enc = encodeURIComponent;
  const google = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + `&text=${enc(title)}&dates=${start}/${end}&details=${enc(details)}&recur=${enc('RRULE:FREQ=YEARLY')}`;
  const esc = (t) => t.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,');
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Business Launchpad//EN',
    'BEGIN:VEVENT',
    `UID:launchpad-annual-fee-${start}@businesslaunchpad`,
    `DTSTAMP:${ymd({ y: new Date().getFullYear(), m: new Date().getMonth() + 1, d: new Date().getDate() })}T000000Z`,
    `DTSTART;VALUE=DATE:${start}`, `DTEND;VALUE=DATE:${end}`,
    'RRULE:FREQ=YEARLY',
    `SUMMARY:${esc(title)}`, `DESCRIPTION:${esc(details)}`,
    'BEGIN:VALARM', 'TRIGGER:-P14D', 'ACTION:DISPLAY', 'DESCRIPTION:Virginia annual fee due in 2 weeks', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
  return { google, ics: 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics) };
}

const STEPS = [
  {
    id: 'name',
    title: 'Choose your business name',
    explanation: 'Your business needs a name no one else in Virginia is using. Search the state’s official database to check. Tip: also check if the website address (domain) is free before you fall in love with a name.',
    cost: 'Free', costNumber: 0,
    time: '~30 minutes',
    action: { label: 'Search names at Virginia SCC ↗', href: 'https://cis.scc.virginia.gov/EntitySearch/Index' },
    tips: [
      'For an LLC, the name must end with “LLC” or “Limited Liability Company.”',
      'Write down 2–3 backup names in case your first pick is taken.',
    ],
    capture: {
      key: 'businessName',
      type: 'text',
      label: 'What name did you land on?',
      placeholder: 'Example: Cloud Shield Systems LLC',
      help: 'We\u2019ll use this on your roadmap and your final summary.',
      required: true,
    },
  },
  {
    id: 'agent',
    title: 'Appoint a registered agent',
    explanation: 'A registered agent is the person who gets official mail for your business — like legal papers and state notices. They must have a street address in Virginia and be around during business hours. You can be your own agent for free, or pay a service (which keeps your home address off public records).',
    cost: '$0 self / $50–$300 per year for a service', costNumber: 0,
    time: '~20 minutes to decide',
    action: { label: 'Registered agent rules (Virginia SCC) ↗', href: 'https://www.scc.virginia.gov/pages/Registered-Agent-FAQs' },
    tips: [
      'Being your own agent is fine if you work from a fixed Virginia address.',
      `If you value privacy or travel a lot, a $${AGENT_SERVICE_COST}/year service is worth it.`,
    ],
    capture: {
      key: 'agentChoice',
      type: 'choice',
      label: 'Who\u2019s your registered agent?',
      options: [
        { value: 'self',    label: '\uD83D\uDC64  Me, at my Virginia address', annualCost: 0 },
        { value: 'service', label: '\uD83C\uDFE2  A registered agent service', annualCost: AGENT_SERVICE_COST },
      ],
    },
  },
  {
    id: 'articles',
    title: 'File Articles of Organization',
    explanation: 'This is the form that officially creates your business with the state. You file it online with the Virginia State Corporation Commission (SCC). Virginia usually approves it the same day or within a few days.',
    cost: '$100 one-time state fee', costNumber: 100,
    time: '~30 minutes online',
    action: { label: 'File online at cis.scc.virginia.gov ↗', href: 'https://cis.scc.virginia.gov' },
    tips: [
      'You’ll need your business name and registered agent info from the last two steps.',
      'Save the approval certificate — the bank will ask for it in Step 5.',
    ],

// Grow a textarea to fit its content (capped by the CSS max-height). scrollHeight excludes
// borders, so add them back or a border-box element ends up a few px short and still scrolls.
function autoGrow(el) {
  if (!el) return;
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight + (el.offsetHeight - el.clientHeight), 260) + 'px';
}

function Quiz({ answers, setAnswers, qIndex, setQIndex, onDone }) {
  const q = QUIZ[qIndex];
  const pick = (value) => {
    const next = { ...answers, [q.id]: value };
    setAnswers(next);
    if (qIndex < QUIZ.length - 1) setQIndex(qIndex + 1);
    else onDone(next);
  };
  return (
    <div className="card">
      <div className="quiz-dots">
        {QUIZ.map((_, i) => <span key={i} className={i <= qIndex ? 'on' : ''} />)}
      </div>
      <div className="step-eyebrow">Find your business type · {qIndex + 1} of {QUIZ.length}</div>
      <h2>{q.question}</h2>
      <p className="sub" style={{ marginBottom: 16 }}>{q.help}</p>
      {q.options.map(opt => (
        <button
          key={opt.value}
          className={'choice' + (answers[q.id] === opt.value ? ' selected' : '')}
          onClick={() => pick(opt.value)}
        >{opt.label}</button>
      ))}
      {qIndex > 0 && (
        <button className="navlink" onClick={() => setQIndex(qIndex - 1)}>← Back</button>
      )}
    </div>
  );
}

function Summary({ idea, reco, record, onRestart, onReview, onGoToStep }) {
  const fixed = STEPS.filter(s => !s.costIsEstimate).reduce((n, s) => n + s.costNumber, 0);
  const est = STEPS.filter(s => s.costIsEstimate).reduce((n, s) => n + s.costNumber, 0);
  const name = displayName(record, idea);
  const agentService = record.agentChoice === 'service';
  const approved = parseISODate(record.articlesDate);
  const due = nextAnnualDue(record.articlesDate);
  const fee = annualFee(reco);
  const cal = due ? calendarLinks(due, (record.businessName || '').trim(), fee) : null;
  const formation = [
    { label: 'Legal name', value: (record.businessName || '').trim() },
    { label: 'Entity type', value: reco.type },
    { label: 'Registered agent', value: record.agentChoice ? (agentService ? 'Registered agent service' : 'Self (my Virginia address)') : '' },
    { label: 'Articles approved', value: approved ? fmtDate(approved) : '' },
    { label: 'EIN', value: (record.ein || '').trim() },
    { label: 'State', value: 'Virginia' },
    { label: 'Annual fee due', value: due ? `${fmtDate(due)} (${fee.amount})` : '' },
  ].filter(r => r.value);
  const hasRecord = Boolean((record.businessName || '').trim() || record.agentChoice || (record.ein || '').trim() || approved);
  const [copied, setCopied] = useState(false);
  const downloadPdf = () => {
    // Print-to-PDF: the .print-sheet is the only thing visible in print media.
    const prev = document.title;
    document.title = `${(record.businessName || '').trim() || 'Business'} - Formation Record`;
    const restore = () => { document.title = prev; window.removeEventListener('afterprint', restore); };
    window.addEventListener('afterprint', restore);
    window.print();
    setTimeout(restore, 60000); // safety net for browsers that never fire afterprint
  };
  const APP_URL = 'https://cloudshieldsystems.github.io/business-launchpad/';
  const recordText = () => ['Formation record — Business Launchpad']
    .concat(formation.map(r => `${r.label}: ${r.value}`))
    .join('\n');
  const flashCopied = () => { setCopied(true); setTimeout(() => setCopied(false), 2000); };
  const copyText = (text) => {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(flashCopied).catch(() => {});
    }
    return Promise.resolve();
  };
  const copyRecord = () => copyText(recordText());
  const [shared, setShared] = useState('');
  const shareRecord = () => {
    const title = `${(record.businessName || '').trim() || 'My business'} — Formation Record`;
    const text = recordText() + `\n\nBuilt with Business Launchpad: ${APP_URL}`;
    if (navigator.share) {
      // Native share sheet (iOS, Android, Safari, Edge, Chrome on desktop)
      navigator.share({ title, text }).catch(err => {
        if (err && err.name === 'AbortError') return; // user closed the sheet
        copyText(text).then(() => { setShared('copied'); setTimeout(() => setShared(''), 2500); });
      });
      return;
    }
    // Fallback: prefilled email
    const a = document.createElement('a');
    a.href = `mailto:?subject=${encodeURIComponent(title)}&body=${encodeURIComponent(text)}`;
    a.rel = 'noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
  return (
    <div>
    <PrintSheet name={name} idea={idea} reco={reco} formation={formation} fee={fee} due={due} fixed={fixed} est={est} agentService={agentService} />
    <div className="no-print">
      <div className="card" style={{ textAlign: 'center', paddingTop: 30 }}>
        <div style={{ fontSize: 44 }}>🎉</div>
        <h1 style={{ fontSize: 24 }}>You did it!</h1>
        <p className="sub">
          {name ? <span><b style={{color:'var(--ink)'}}>{name}</b> is now a real, legal business in Virginia.</span>
            : 'Your business is now legally formed in Virginia.'}
        </p>
      </div>

      {hasRecord && (
        <div className="card">
          <h2 style={{ fontSize: 17 }}>Your formation record</h2>
          <p className="sub" style={{ fontSize: 13.5 }}>Keep this handy — the bank, your accountant, and Virginia Tax will all ask for it.</p>
          <div className="record-list">
            {formation.map(r => (
              <div className="record-row" key={r.label}>
                <span className="k">{r.label}</span>
                <span className="v">{r.value}</span>
              </div>
            ))}
          </div>
          <button className="btn btn-primary" onClick={downloadPdf} style={{ marginTop: 14 }}>
            ⬇ Download PDF
          </button>
          <div className="btn-row">
            <button className="btn btn-secondary" onClick={shareRecord}>
              {shared === 'copied' ? 'Copied instead ✓' : '↗ Share'}
            </button>
            <button className="btn btn-secondary" onClick={copyRecord}>
              {copied ? 'Copied ✓' : 'Copy'}
            </button>
          </div>
          <div className="field-help" style={{ textAlign: 'center', marginTop: 8, marginBottom: 0 }}>
            PDF opens your device’s print dialog — choose “Save as PDF”. Share sends the record as text to Messages, Mail, or Notes.
          </div>
        </div>
      )}

      <div className="card">
        <h2 style={{ fontSize: 17 }}>📅 Keep it alive: the annual fee</h2>
        <p className="sub" style={{ fontSize: 14 }}>
          Virginia charges a <b style={{ color: 'var(--ink)' }}>{fee.amount} {fee.label}</b> every year, due by the last day of the month your business was formed. Miss it and there’s a $25 penalty — leave it long enough and the state cancels your business.
        </p>
        {due ? (
          <div>
            <div className="due-box">
              <div className="k">Next due</div>
              <div className="v">{fmtDate(due)}</div>
              <div className="d">{fee.amount} · pay online at cis.scc.virginia.gov · repeats every year</div>
            </div>
            <a className="btn btn-primary" href={cal.google} target="_blank" rel="noopener noreferrer">Add to Google Calendar ↗</a>
            <a className="btn btn-secondary" href={cal.ics} download="virginia-annual-fee.ics">Download for Apple / Outlook (.ics)</a>
            <div className="field-help" style={{ marginTop: 10, marginBottom: 0 }}>The reminder repeats yearly and pings you two weeks before the due date.</div>
          </div>
        ) : (
          <div>
            <div className="field-help">Add the date the SCC approved your Articles (Step 3) and we’ll show your exact due date and build a yearly calendar reminder.</div>
            <button className="btn btn-secondary" onClick={() => onGoToStep(STEPS.findIndex(s => s.id === 'articles'))}>Add my approval date</button>
          </div>
        )}
      </div>

      <div className="card">
        <h2 style={{ fontSize: 17 }}>Everything you completed</h2>
        <div className="summary-list">
          <div className="summary-item">
            <span className="check">✓</span>
            <span>Chose your business type: <b>{reco.type}</b></span>
          </div>
          {STEPS.map((s, i) => (
            <div className="summary-item" key={s.id}>
              <span className="check">✓</span>
              <span>{s.title}</span>
              <span className="cost">
                {s.id === 'agent' && agentService
                  ? `~$${AGENT_SERVICE_COST}/yr`
                  : s.costNumber > 0
                    ? (s.costIsEstimate ? '~$' : '$') + s.costNumber
                    : 'Free'}
              </span>
            </div>
          ))}
        </div>
        <div className="total-row">
          <span>Total spent</span>
          <span className="amt">${fixed}{est > 0 ? ` + ~$${est}` : ''}</span>
        </div>
        <div className="total-foot">
          ${fixed} in required state fees, plus about ${est} for your local license (varies by county).
          Registered agent service and bank fees extra if you chose those.
          {agentService && (
            <div style={{ marginTop: 6 }}>Registered agent service: ~${AGENT_SERVICE_COST}/year (recurring, not included in the total above).</div>
          )}
        </div>
      </div>

      <div className="card">
        <h2 style={{ fontSize: 17 }}>What’s next for your business</h2>
        <p className="sub" style={{ fontSize: 13.5 }}>Coming soon to Business Launchpad — here’s what to think about now:</p>
        <div style={{ marginTop: 6 }}>
          {WHATS_NEXT.map((n, i) => (
            <div className="next-item" key={i}>
              <div className="ico">{n.icon}</div>
              <div>
                <div className="t">{n.title}</div>
                <div className="d">{n.detail}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <button className="btn btn-secondary" onClick={onReview}>Review my steps</button>
      <button className="reset-link" onClick={onRestart}>Start over with a new business</button>
    </div>
    </div>
  );
}

function App() {
  const saved = loadState();
  const [phase, setPhase] = useState(saved.phase || 'welcome');
  const [idea, setIdea] = useState(saved.idea || '');
  const [team, setTeam] = useState(saved.team || null);
  const [answers, setAnswers] = useState(saved.answers || {});
  const [qIndex, setQIndex] = useState(saved.qIndex || 0);
  const [completed, setCompleted] = useState(new Set(saved.completed || []));
  const [viewIndex, setViewIndex] = useState(saved.viewIndex || 0);
  const [record, setRecord] = useState(saved.record || {});
  const setRecordField = (key, value) => setRecord(prev => ({ ...prev, [key]: value }));

  useEffect(() => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        phase, idea, team, answers, qIndex, record,
        completed: Array.from(completed), viewIndex,
      }));
    } catch {}
  }, [phase, idea, team, answers, qIndex, record, completed, viewIndex]);

  const reco = recommendEntity(answers);

  const markComplete = (id) => {
    const next = new Set(completed);
    next.add(id);
    setCompleted(next);
    if (next.size >= STEPS.length) {
      setPhase('done');
    } else {
      // jump to the first not-yet-done step after the current one
      let j = viewIndex + 1;
      while (j < STEPS.length && next.has(STEPS[j].id)) j++;
      if (j >= STEPS.length) { j = STEPS.findIndex(s => !next.has(s.id)); }
      setViewIndex(j);
    }
  };

  const undoComplete = (id) => {
    const next = new Set(completed);
    next.delete(id);
    setCompleted(next);
  };

  const restart = () => {
    try { localStorage.removeItem(STORE_KEY); } catch {}
    setPhase('welcome'); setIdea(''); setTeam(null);
    setAnswers({}); setQIndex(0);
    setCompleted(new Set()); setViewIndex(0); setRecord({});
  };

  return (
    <div>
      <TopBar />

      {phase === 'roadmap' && <ProgressBar done={completed.size} total={STEPS.length} />}

      {phase === 'welcome' && <Welcome onStart={() => setPhase('intake')} />}

      {phase === 'intake' && (
        <Intake
          idea={idea} setIdea={setIdea}
          team={team} setTeam={setTeam}
          onNext={() => { setQIndex(0); setPhase('quiz'); }}
        />
      )}

      {phase === 'quiz' && (
        <Quiz
          answers={answers} setAnswers={setAnswers}
          qIndex={qIndex} setQIndex={setQIndex}
          onDone={() => setPhase('reco')}
        />
      )}

      {phase === 'reco' && (
        <Recommendation reco={reco} team={team} onNext={() => { setViewIndex(0); setPhase('roadmap'); }} />
      )}

      {phase === 'roadmap' && (
        <div>
          {(record.businessName || idea.trim()) && (
            <div className="idea-banner">
              Your roadmap for: <b>{displayName(record, idea)}</b> · {reco.type}
            </div>
          )}
          <StepCard
            step={STEPS[viewIndex]}
            index={viewIndex}
            completed={completed}
            record={record}
            setRecordField={setRecordField}
            onComplete={() => markComplete(STEPS[viewIndex].id)}
            onUndo={() => undoComplete(STEPS[viewIndex].id)}
            onPrev={() => setViewIndex(viewIndex - 1)}
            onNext={() => setViewIndex(viewIndex + 1)}
            canPrev={viewIndex > 0}
            canNext={viewIndex < STEPS.length - 1}
          />
        </div>
      )}

      {phase === 'done' && (
        <Summary
          idea={idea} reco={reco} record={record}
          onRestart={restart}
          onReview={() => { setViewIndex(0); setPhase('roadmap'); }}
          onGoToStep={(i) => { setViewIndex(i); setPhase('roadmap'); }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
